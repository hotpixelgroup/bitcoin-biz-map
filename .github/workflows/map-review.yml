name: Publish approved map submissions
on:
  issues:
    types: [opened, labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Business issue number
        required: true
        type: string
      mode:
        description: Prepare review data or publish an approved issue
        type: choice
        options: [prepare, publish]
        default: prepare
permissions:
  contents: read
concurrency:
  group: map-review-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false
jobs:
  prepare:
    if: >-
      github.repository == 'hotpixelgroup/bitcoin-biz-map' &&
      (github.event.action == 'opened' ||
       (github.event.action == 'labeled' && github.event.label.name == 'needs-review') ||
       (github.event_name == 'workflow_dispatch' && inputs.mode == 'prepare'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
      - run: node scripts/review-submission.mjs
        env:
          REVIEW_MODE: prepare
          GH_TOKEN: ${{ github.token }}
  publish:
    if: >-
      github.repository == 'hotpixelgroup/bitcoin-biz-map' &&
      ((github.event.action == 'labeled' && github.event.label.name == 'approved') ||
       (github.event_name == 'workflow_dispatch' && inputs.mode == 'publish'))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
      - run: node scripts/review-submission.mjs
        env:
          REVIEW_MODE: publish
          GH_TOKEN: ${{ github.token }}
